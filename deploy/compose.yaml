services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 4180
      AAG_DB_PATH: /data/aag.sqlite
      AAG_BACKUP_DIR: /data/backups
      AAG_UPLOAD_DIR: /data/uploads
      PUBLIC_BASE_URL: https://${DOMAIN:?Set DOMAIN in the env file}
      NODE_ENV: production
      TRUST_PROXY: "1"
    volumes:
      - aag_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4180/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in the env file}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  aag_data:
  caddy_data:
  caddy_config:
