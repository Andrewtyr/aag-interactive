<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Участие — ААГ Интерактив</title><link rel="stylesheet" href="./src/styles/live.css"><link rel="stylesheet" href="./src/styles/slide-elements.css"><link rel="stylesheet" href="./src/styles/word-cloud.css"><script src="./src/slide-elements.js" defer></script><script src="./src/word-cloud.js" defer></script><script src="./src/presentation-view.js" defer></script><script src="./src/participant.js" defer></script><link rel="stylesheet" href="./src/styles/modern.css"><link rel="stylesheet" href="./src/styles/academy.css"></head><body>
<header><a href="./index.html">ААГ Интерактив</a><strong>Участие</strong><span>Занятие или мероприятие</span></header>
<main class="participant-main"><section id="join-panel" class="panel narrow"><small>ПОДКЛЮЧЕНИЕ</small><h1>Присоединиться</h1><p>Введите код с экрана ведущего и имя для участия. Для входа с учётной записью войдите ниже.</p><form id="join-form" class="form"><label>Код из шести цифр<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label><label>Ваше имя<input name="name" maxlength="40" required></label><button>Подключиться</button></form><p id="account-status"></p><form id="account-login-form" class="form"><label>Логин аккаунта<input name="login" autocomplete="username"></label><label>Пароль аккаунта<input name="password" type="password" autocomplete="current-password"></label><button type="submit">Войти с аккаунтом</button></form></section>
<section id="participant-panel" class="panel" hidden><div class="slide-heading"><span id="slide-number"></span><span id="timer"></span></div><div id="stage" class="stage"></div><div id="answer-panel" aria-live="polite"></div><p id="own-score"></p></section><p id="message" role="status" aria-live="polite"></p></main></body></html>
